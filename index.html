:root {
  --bg: #f8f5ed;
  --card: #ffffff;
  --green: #244b3c;
  --gold: #b58a46;
  --text: #292d29;
  --muted: #77786f;
  --border: #e9e1d2;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;

  font-family: Georgia, "Noto Serif", serif;
  background: var(--bg);
  color: var(--text);

header {

  text-align: center;
}

.logo {

  font-weight: bold;
}

.tagline {
  color: #f0dfb9;
  font-size: 14px;
  margin-top: 2px;
}

nav {
  background: #fff;
  padding: 13px 10px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

nav a {
  color: var(--green);
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

nav a:hover {
  color: var(--gold);
}

.hero {
  text-align: center;
  padding: 42px 18px 25px;
}

.hero h1 {

}

  background: white;
}

#search:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #b58a4620;
}

.section {
  max-width: 1100px;
  margin: auto;
  padding: 30px 17px;
}

.section-title {
  text-align: center;
  color: var(--green);
  font-size: 27px;
  margin-bottom: 7px;
}

.section-subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 24px;
  font-size: 14px;
}

.poet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 13px;
}

.poet-card {
  display: block;
  text-align: center;
  padding: 22px 10px;
  border-radius: 15px;
  background: white;
  border: 1px solid var(--border);
  color: var(--green);
  text-decoration: none;
  transition: 0.2s;
}

.poet-card:hover {
  transform: translateY(-3px);
  border-color: var(--gold);
}

.poet-icon {
  font-size: 28px;
  display: block;
  margin-bottom: 6px;
}

.poet-card strong {
  display: block;
  font-size: 16px;
}

.poet-card small {
  color: var(--muted);
  font-size: 12px;
}

.featured {
  background: var(--green);
  color: white;
  border-radius: 18px;
  padding: 26px 20px;
  text-align: center;
  margin-bottom: 22px;
}

.featured h2 {
  font-size: 27px;
  color: #f0dfb9;
}

.featured p {
  margin: 8px 0 16px;
}

.button {
  display: inline-block;
  padding: 10px 17px;
  border-radius: 24px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.button-gold {
  background: #e6c68b;
  color: #263c30;
}

.filters {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.filter-btn {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #d9cfbd;
  background: white;
  color: var(--green);
  cursor: pointer;
}

.filter-btn.active,
.filter-btn:hover {
  background: var(--green);
  color: white;
}

.poetry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
  gap: 17px;
}

</body>
